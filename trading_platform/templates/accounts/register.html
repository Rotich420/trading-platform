{% extends 'base.html' %}
{% block title %}Create Account — TradeX Pro{% endblock %}

{% block content %}
<div class="auth-layout">
    <div class="auth-card">

        <div class="auth-logo">
            <span class="auth-logo-dot"></span>
            TradeX
        </div>

        <h1 class="auth-title">Create account</h1>
        <p class="auth-subtitle">Start trading in under a minute</p>

        <form method="POST">
            {% csrf_token %}

            <div class="auth-form-group">
                <label class="auth-label">Username</label>
                <input class="auth-input" type="text" name="username" placeholder="Choose a username" autocomplete="username">
            </div>

            <div class="auth-form-group">
                <label class="auth-label">Email</label>
                <input class="auth-input" type="email" name="email" placeholder="you@example.com" autocomplete="email">
            </div>

            <div class="auth-form-group">
                <label class="auth-label">Password</label>
                <input class="auth-input" type="password" name="password" placeholder="Create a password" autocomplete="new-password">
            </div>

            <button type="submit" class="auth-submit">Create Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/accounts/login/">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
